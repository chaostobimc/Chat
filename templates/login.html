{% extends "base.html" %}

{% block title %}Login - Ticket Bot Dashboard{% endblock %}

{% block auth_content %}
<div class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-ticket-alt"></i>
                </div>
                <h1>Ticket Bot</h1>
                <p>Melde dich an um fortzufahren</p>
            </div>
            
            {% if error %}
            <div class="login-error">
                <i class="fas fa-exclamation-circle"></i>
                {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('auth') }}" class="login-form">
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Passwort
                    </label>
                    <input type="password" id="password" name="password" 
                           placeholder="Passwort eingeben..." required autofocus>
                </div>
                
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Anmelden
                </button>
            </form>
            
            <div class="login-footer">
                <p>Standard-Passwort: <code>admin</code></p>
                <p class="login-tip">Ändere das Passwort in den Einstellungen!</p>
            </div>
        </div>
        
        <div class="login-decoration">
            <div class="deco-circle deco-1"></div>
            <div class="deco-circle deco-2"></div>
            <div class="deco-circle deco-3"></div>
        </div>
    </div>
</div>
{% endblock %}
